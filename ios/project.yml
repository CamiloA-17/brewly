# XcodeGen spec. Generate the Xcode project with:
#
#   brew install xcodegen
#   xcodegen generate        (or `make ios-project` from the repository root)
#
# Brewly.xcodeproj is generated and ignored by git. All app code lives in the
# local Swift package BrewlyKit; this target is only the app shell.

name: Brewly

options:
  bundleIdPrefix: app.brewly
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer Team ID to run on a device.
    DEVELOPMENT_TEAM: ""

packages:
  BrewlyKit:
    path: BrewlyKit

targets:
  Brewly:
    type: application
    platform: iOS
    sources:
      - path: Brewly
    configFiles:
      Debug: Config/Brewly.xcconfig
      Release: Config/Brewly.xcconfig
    dependencies:
      - package: BrewlyKit
        product: AppFeature
    info:
      path: Brewly/Info.plist
      properties:
        CFBundleDisplayName: Brewly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        BrewlyAPIBaseURL: $(BREWLY_API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BREWLY_BUNDLE_IDENTIFIER)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
      configs:
        Release:
          BREWLY_API_BASE_URL: https://api.brewly.app

schemes:
  Brewly:
    build:
      targets:
        Brewly: all
    run:
      config: Debug
    archive:
      config: Release
