# Definición del proyecto para XcodeGen (https://github.com/yonaskolb/XcodeGen).
#   brew install xcodegen && cd ios && xcodegen generate && open Brewly.xcodeproj
name: Brewly
options:
  bundleIdPrefix: com.brewly
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
packages:
  BrewlyKit:
    path: Packages/BrewlyKit
targets:
  Brewly:
    type: application
    platform: iOS
    sources:
      - Brewly
    configFiles:
      Debug: Brewly/Config/Base.xcconfig
      Release: Brewly/Config/Base.xcconfig
    dependencies:
      - package: BrewlyKit
        product: BrewlyDomain
      - package: BrewlyKit
        product: BrewlyData
      - package: BrewlyKit
        product: BrewlyFeatures
    entitlements:
      path: Brewly/Brewly.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        aps-environment: development
    info:
      path: Brewly/Info.plist
      properties:
        CFBundleDisplayName: Brewly
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        NSPhotoLibraryUsageDescription: Brewly usa tus fotos para ilustrar tus publicaciones y tu perfil.
        NSCameraUsageDescription: Brewly usa la cámara para fotografiar tus cafés y preparaciones.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brewly.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.10"
